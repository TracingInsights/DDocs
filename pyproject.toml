[project]
name = "fia-f1-documents"
version = "0.1.0"
description = "Scrape and extract FIA Formula 1 documents."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiofiles>=25.1.0",
    "aiohttp>=3.13.5",
    "beautifulsoup4>=4.14.3",
    "curl-cffi>=0.15.0",
    "pdfplumber>=0.10.0",
    "pillow>=10.0.0",
    "kreuzberg>=4.9.0",
    "pymupdf>=1.26.0",
    "jinja2>=3.1.0",
    "marker-pdf>=0.2.0",
    "pypdf>=6.1.0",
    "rich>=14.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
exclude = [
    "/.venv",
    "/.github",
    "/classification",
    "/documents",
    "/extracted",
    "/processed_documents",
    "/scratch",
    "*.md",
    "*.json",
    "test_*.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
