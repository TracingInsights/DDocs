[project]
name = "fia-pdf-processor"
version = "0.1.0"
description = "FIA F1 Decision Document PDF Processor with Hybrid Extraction"
authors = [
    {name = "Developer", email = "dev@example.com"},
]
dependencies = [
    "pymupdf>=1.23.0",
    "pdfplumber>=0.10.0", 
    "beautifulsoup4>=4.12.0",
    "pillow>=10.0.0",
    "jinja2>=3.1.0",
    "rich>=13.0.0",
    "marker-pdf>=0.2.0",
]
requires-python = ">=3.10"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
exclude = [
    "/.venv",
    "/.github",
    "/processed_documents",
    "/classification",
    "/.dirac-symbol-index",
    "*.md",
    "*.json",
    "test_*.py",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]