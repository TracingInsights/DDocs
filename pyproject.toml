[project]
name = "fia-f1-documents"
version = "0.1.0"
description = "Scrape and extract FIA Formula 1 documents."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiofiles>=25.1.0",
    "aiohttp>=3.14.2",
    "beautifulsoup4>=4.15.0",
    "curl-cffi>=0.15.0",
    "pdfplumber>=0.11.10",
    "kreuzberg>=4.10.2",
    "pymupdf>=1.28.0",
    "jinja2>=3.1.6",
    "marker-pdf>=2.0.0",
    "pypdf>=6.14.2",
    "rich>=15.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.22",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
exclude = [
    "/.venv",
    "/.github",
    "/classification",
    "/documents",
    "/extracted",
    "/processed_documents",
    "/scratch",
    "*.md",
    "*.json",
    "test_*.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.uv]
environments = ["sys_platform == 'linux'"]
