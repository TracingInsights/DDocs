[project]
name = "fia-rag"
version = "0.1.0"
description = "FIA Documents RAG — Chat with the FIA Docs"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django>=5.2",
    "django-ninja>=1.4.0",
    "duckdb>=1.3.0",
    "lancedb>=0.22.0",
    "rank-bm25>=0.2.2",
    "google-genai>=0.2.0",
    "python-jose[cryptography]>=3.5.0",
    "gunicorn>=23.0.0",
    "uvicorn>=0.34.0",
    "aiofiles>=25.1.0",
    "numpy>=2.2.6",
    "pylance>=6.0.1",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-django>=4.11.1",
    "ruff==0.15.12",
    "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fia_project", "core"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "fia_project.settings"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
